org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true
# Windows workaround: external Kotlin daemon dies with "Daemon compilation
# failed" / corrupts incremental caches; run the compiler inside Gradle instead
kotlin.compiler.execution.strategy=in-process
# Same root cause: the shared incremental-cache storage double-registers under
# Gradle's in-process compiler; disable it (costs rebuild speed only)
kotlin.incremental=false
