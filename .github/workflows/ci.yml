# CI gate for mine-flow-app — runs on every push and pull request.
#
# Gates (from Doc 12 — Test Strategy §6 CI Gates):
#   1. Code formatting check (dart format)
#   2. Static analysis (flutter analyze)
#   3. Unit & widget tests (flutter test)
#   4. Build smoke check — Android debug APK
#
# Secrets injected via GitHub Repository Secrets (Doc 09 — Environments §2):
#   SUPABASE_URL, SUPABASE_ANON_KEY, GOOGLE_DRIVE_CLIENT_ID
# For CI we use staging credentials so tests target the staging Supabase project.

name: ci

on:
  push:
  pull_request:
  # deploy-production keys off github.event_name == 'release'; without this
  # trigger the workflow never runs on a published Release (found in the
  # STEP-42.5 dry-run — the gate test produced no workflow run).
  release:
    types: [published]

jobs:
  test:
    name: Lint, analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Supabase Contract
        run: dart run tool/check_supabase_contracts.dart

      - name: Check Localization Baseline
        run: dart run tool/check_l10n_baseline.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
        env:
          # Tests that instantiate Supabase need a reachable URL; use the
          # staging project. Tests that don't need Supabase mock it (see
          # Doc 12 — Test Strategy §5 Mocking strategy).
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          APP_ENV: staging

  build-android:
    name: Build Android APK (smoke check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=APP_ENV=staging 2>&1 | tee build_android.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-android-log
          path: build_android.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  e2e-web:
    name: E2E Tests (Web)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Overwrite system Chrome with setup-chrome version
        run: sudo ln -sf ${{ steps.setup-chrome.outputs.chrome-path }} /opt/google/chrome/chrome

      - name: Get dependencies
        run: flutter pub get

      - name: Start chromedriver
        run: |
          chromedriver --port=4444 --log-path=chromedriver.log &
          # wait for the port instead of a blind sleep
          for i in $(seq 1 30); do
            curl -sf http://localhost:4444/status && break
            sleep 1
          done
          curl -sf http://localhost:4444/status

      - name: Run E2E tests on Chrome (driver)
        timeout-minutes: 60
        run: |
          # Loop over all integration tests to run them sequentially via flutter drive.
          # The loop aggregates the logs. We require at least one test to pass or fail 
          # across all files to ensure we aren't just skipping everything.
          # data_bucket_journey_test.dart legitimately skips.
          fail=0
          touch all_web.log
          for file in integration_test/app_boots_test.dart integration_test/journeys/*_test.dart; do
            echo "Running $file"
            wrapper="run_web_wrapper.dart"
            echo "import '$file' as test_main; void main() => test_main.main();" > "$wrapper"
            if ! flutter drive \
              --driver=test_driver/integration_test.dart \
              --target="$wrapper" \
              -d web-server \
              --browser-name=chrome \
              --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
              --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
              --dart-define=TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }} \
              --dart-define=TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} \
              --dart-define=TEST_SUPERVISOR_EMAIL=${{ secrets.TEST_SUPERVISOR_EMAIL }} \
              --dart-define=TEST_SUPERVISOR_PASSWORD=${{ secrets.TEST_SUPERVISOR_PASSWORD }} \
              --dart-define=TEST_FOREMAN_EMAIL=${{ secrets.TEST_FOREMAN_EMAIL }} \
              --dart-define=TEST_FOREMAN_PASSWORD=${{ secrets.TEST_FOREMAN_PASSWORD }} \
              --dart-define=APP_ENV=staging > web_current.log 2>&1; then
              fail=1
            fi
            cat web_current.log | tee -a all_web.log
          done
          # The zero-executed check: if the aggregated log shows NO tests passed, and NO tests failed,
          # it means all were skipped or crashed without reporting. We tolerate individual honest skips 
          # (like data_bucket_journey_test.dart), but across the whole suite, some must pass or fail.
          if ! grep -qE "\+[1-9]|\-[1-9]|All tests passed|Some tests failed" all_web.log; then
            echo "Error: Zero tests executed across all files."
            exit 1
          fi
          exit $fail

      - name: Upload driver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-driver-log
          path: |
            chromedriver.log
            all_web.log
          retention-days: 7

      - name: Upload Screenshots (Web)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: screenshots/
          retention-days: 7

  e2e-android:
    # Q2 Decision: Run on every push (slower PR feedback, but higher safety).
    name: E2E Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 1200
          # The action splits this input on newlines and runs each line as its
          # own `sh -c` (script-parser.ts), so backslash continuations are NOT
          # honoured — a trailing `\` is passed to `flutter test` as a test
          # path, which mixes a non-integration_test path into the run and trips
          # "Integration tests and unit tests cannot be run in a single
          # invocation". Keep the whole command on ONE line. `sh` here is dash:
          # no `set -o pipefail`, hence the redirect + saved exit status instead
          # of a pipe to tee.
          #
          # Runs all integration tests. data_bucket_journey_test.dart skips honestly.
          # We ensure at least one test executed using grep on the log.
          script: |
            flutter test integration_test/ -d "$ANDROID_SERIAL" --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} --dart-define=TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }} --dart-define=TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} --dart-define=TEST_SUPERVISOR_EMAIL=${{ secrets.TEST_SUPERVISOR_EMAIL }} --dart-define=TEST_SUPERVISOR_PASSWORD=${{ secrets.TEST_SUPERVISOR_PASSWORD }} --dart-define=TEST_FOREMAN_EMAIL=${{ secrets.TEST_FOREMAN_EMAIL }} --dart-define=TEST_FOREMAN_PASSWORD=${{ secrets.TEST_FOREMAN_PASSWORD }} --dart-define=APP_ENV=staging > integration_test.log 2>&1; status=$?; cat integration_test.log; if ! grep -qE "\+[1-9]|\-[1-9]|All tests passed|Some tests failed" integration_test.log; then echo "Error: Zero tests executed!"; exit 1; fi; exit $status

      - name: Upload Android E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-log
          path: integration_test.log
          retention-days: 7

      - name: Upload Screenshots (Android)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshots/
          retention-days: 7

  deploy-staging:
    # Deploys Flutter Web (built with staging credentials) to the staging
    # GitHub Pages slot on every push to master. See Doc 09 §4 Promotion Flow.
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-android, e2e-web, e2e-android]
    if: github.ref == 'refs/heads/master'
    # peaceiris/actions-gh-pages pushes the gh-pages-staging branch with the
    # default GITHUB_TOKEN, which is read-only unless contents:write is granted.
    permissions:
      contents: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web (staging)
        # --base-href is required because Pages serves this site under
        # /mine-flow-app/staging/; without it asset requests resolve to the
        # domain root and 404.
        run: |
          flutter build web --release \
            --base-href=/mine-flow-app/staging/ \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL=${{ secrets.STAGING_GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL }} \
            --dart-define=GOOGLE_DRIVE_FOLDER_ID=${{ secrets.STAGING_GOOGLE_DRIVE_FOLDER_ID }} \
            --dart-define=APP_ENV=staging

      - name: Deploy to GitHub Pages (staging)
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: staging
          publish_branch: gh-pages-staging

      - name: Download staging APK from build-android
        # The debug APK was already built by build-android (this job's
        # `needs` dependency); re-publish it under the staging artifact name
        # instead of rebuilding it.
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts/apk

      - name: Upload staging APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk-${{ github.sha }}
          path: artifacts/apk/app-debug.apk
          retention-days: 14

  deploy-production:
    # Deploys Flutter Web + release APK when a GitHub Release is published.
    # Gated behind the `production` GitHub environment (required reviewer):
    # the job waits for manual approval before any step runs. See Doc 09 §4
    # Promotion Flow. PROD_* secrets are set before the first real release.
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    # peaceiris/actions-gh-pages pushes the gh-pages branch and
    # softprops/action-gh-release attaches the APK; GITHUB_TOKEN is read-only
    # unless contents:write is granted.
    permissions:
      contents: write
    environment:
      name: production
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web (production)
        # --base-href is required because Pages serves this site under
        # /mine-flow-app/; without it asset requests resolve to the domain
        # root and 404 (same fix as deploy-staging in STEP-42.4).
        run: |
          flutter build web --release \
            --base-href=/mine-flow-app/ \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL=${{ secrets.PROD_GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL }} \
            --dart-define=GOOGLE_DRIVE_FOLDER_ID=${{ secrets.PROD_GOOGLE_DRIVE_FOLDER_ID }} \
            --dart-define=APP_ENV=production

      - name: Deploy to GitHub Pages (production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

      - name: Build Android release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL=${{ secrets.PROD_GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL }} \
            --dart-define=GOOGLE_DRIVE_FOLDER_ID=${{ secrets.PROD_GOOGLE_DRIVE_FOLDER_ID }} \
            --dart-define=APP_ENV=production

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
